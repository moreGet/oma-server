{{define "content"}}
<div class="row g-3 mb-4">
  <div class="col-12 col-md-6">
    <div class="card h-100"><div class="card-body d-flex align-items-center gap-3">
      <span class="stat-ic"><i class="bi bi-person-badge"></i></span>
      <div><div class="text-secondary small fw-semibold">사용자</div>
        <div class="fs-5 fw-bold">{{.User.Username}}</div></div>
    </div></div>
  </div>
  <div class="col-12 col-md-6">
    <div class="card h-100"><div class="card-body d-flex align-items-center gap-3">
      <span class="stat-ic"><i class="bi bi-shield-check"></i></span>
      <div><div class="text-secondary small fw-semibold">역할 · 레벨 {{.User.Level}}</div>
        <div class="mt-1"><span class="badge rounded-pill badge-{{.User.Role}} fs-6">{{.User.Role}}</span></div></div>
    </div></div>
  </div>
</div>

<div class="card" style="max-width:32rem">
  <div class="card-header bg-transparent fw-semibold"><i class="bi bi-key me-1"></i> 비밀번호 변경</div>
  <div class="card-body">
    <form method="post" action="/admin/account/password">
      <div class="mb-3">
        <label class="form-label small text-secondary">현재 비밀번호</label>
        <input type="password" name="old_password" class="form-control" autocomplete="current-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-secondary">새 비밀번호 (8자 이상)</label>
        <input type="password" name="new_password" class="form-control" autocomplete="new-password" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 변경</button>
    </form>
  </div>
</div>
{{end}}
