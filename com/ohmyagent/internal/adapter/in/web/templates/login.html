<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · OhMyAgent Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { min-height:100vh; display:grid; place-items:center;
      background:radial-gradient(1100px 600px at 50% -5%, #1b1f31 0%, #0f1117 55%); }
    .login-card { width:100%; max-width:24rem; }
    .logo { width:60px; height:60px; border-radius:16px; display:grid; place-items:center; margin:0 auto;
      background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; font-size:1.8rem;
      box-shadow:0 10px 28px rgba(99,102,241,.4); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="card shadow-lg border-0">
      <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
          <div class="logo mb-3"><i class="bi bi-robot"></i></div>
          <h1 class="h4 fw-bold mb-1">OhMyAgent Admin</h1>
          <p class="text-secondary small mb-0">관리자 콘솔에 로그인하세요</p>
        </div>
        {{if .Error}}
        <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i><span>{{.Error}}</span>
        </div>
        {{end}}
        <form method="post" action="/admin/login">
          <div class="mb-3">
            <label class="form-label small text-secondary">아이디</label>
            <input type="text" name="username" class="form-control form-control-lg" autocomplete="username" placeholder="username" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label small text-secondary">비밀번호</label>
            <input type="password" name="password" class="form-control form-control-lg" autocomplete="current-password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-box-arrow-in-right"></i> 로그인</button>
        </form>
      </div>
    </div>
    <p class="text-center text-secondary small mt-3 mb-0">OhMyAgent AI Agent Server</p>
  </div>
</body>
</html>
