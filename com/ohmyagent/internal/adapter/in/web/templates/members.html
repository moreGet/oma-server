{{define "content"}}
<h2>멤버 관리</h2>

{{if .CanManageMembers}}
<article>
  <header>새 멤버 생성</header>
  <form method="post" action="/admin/members">
    <div class="grid">
      <input type="text" name="username" placeholder="아이디" required>
      <input type="password" name="password" placeholder="비밀번호(8자 이상)" required>
      <select name="role_id" required>
        {{range .Data.Roles}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
      </select>
      <button type="submit">생성</button>
    </div>
  </form>
</article>
{{end}}

<figure>
<table>
  <thead>
    <tr><th>아이디</th><th>역할</th><th>활성</th><th>생성일</th>{{if .CanManageMembers}}<th>작업</th>{{end}}</tr>
  </thead>
  <tbody>
    {{range $m := .Data.Members}}
    <tr>
      <td>{{$m.Username}}</td>
      <td><span class="badge">{{$m.Role}}</span></td>
      <td>{{if $m.Active}}<span class="ok">●</span> 활성{{else}}<span class="off">○</span> 비활성{{end}}</td>
      <td><small class="muted">{{$m.CreatedAt}}</small></td>
      {{if $.CanManageMembers}}
      <td class="actions">
        <form method="post" action="/admin/members/{{$m.ID}}/role">
          <select name="role_id">
            {{range $.Data.Roles}}<option value="{{.ID}}" {{if eq .Name $m.Role}}selected{{end}}>{{.Name}}</option>{{end}}
          </select>
          <button type="submit" class="outline">역할변경</button>
        </form>
        <form method="post" action="/admin/members/{{$m.ID}}/active">
          <input type="hidden" name="active" value="{{if $m.Active}}false{{else}}true{{end}}">
          <button type="submit" class="secondary outline">{{if $m.Active}}비활성화{{else}}활성화{{end}}</button>
        </form>
        <form method="post" action="/admin/members/{{$m.ID}}/password">
          <input type="password" name="new_password" placeholder="새 비밀번호" required>
          <button type="submit" class="outline">비번리셋</button>
        </form>
        {{if $.CanDeleteMembers}}
        <form method="post" action="/admin/members/{{$m.ID}}/delete" hx-confirm="정말 이 멤버를 삭제할까요?">
          <button type="submit" class="contrast outline">삭제</button>
        </form>
        {{end}}
      </td>
      {{end}}
    </tr>
    {{end}}
  </tbody>
</table>
</figure>
<small class="muted">역할 제어: super_admin → admin·user, admin → user. 삭제는 super_admin 만 가능.</small>
{{end}}
