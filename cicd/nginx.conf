# OhMyAgent API — nginx 리버스 프록시 설정 (HTTP 압축)
#
# 클라이언트 압축 스펙 §2(응답 압축)·§3(SSE 제외) 대응.
# §1(요청 본문 gzip 수용)은 nginx 로 해결되지 않으므로 API 앱이 처리한다
# (com/ohmyagent/internal/adapter/in/http/compression.go).
#
# 주의: ngx_http_gunzip_module 은 이름과 달리 *업스트림이 준 응답*을 푸는 모듈이다.
# 클라이언트가 보낸 요청 본문은 풀어주지 않으므로 여기에 넣어봐야 소용이 없다.

upstream oma_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # --- §2 응답 압축 -------------------------------------------------------
    # gzip_types 에 text/event-stream 을 넣지 않는 것이 핵심이다(§3 참고).
    # text/html 은 gzip 지시어가 항상 암묵 포함하므로 따로 적지 않는다.
    gzip              on;
    gzip_types        application/json;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_vary         on;

    location / {
        proxy_pass         http://oma_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 요청 본문 상한. API 앱의 maxLargeJSONBytes(32MiB)보다 여유를 둔다 —
        # 여기서 먼저 끊으면 앱이 정의한 413/415 대신 nginx 기본 오류 페이지가 나간다.
        client_max_body_size 40m;
    }

    # --- §3 SSE 는 압축·버퍼링에서 제외 (회귀 방지) --------------------------
    # gzip 은 압축 버퍼가 찰 때까지 출력을 모은다. 이벤트 스트림에 걸면 토큰이 실시간으로
    # 흐르지 않고 뭉텅이로 늦게 도착해 사용자 체감이 눈에 띄게 나빠진다.
    # proxy_buffering 도 같은 이유로 꺼야 한다(nginx 가 응답을 모았다 보내는 것을 막는다).
    location /api/v1/agent/chat {
        proxy_pass         http://oma_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        gzip                      off;
        proxy_buffering           off;
        chunked_transfer_encoding off;

        # 스트리밍 응답은 오래 열려 있다. 기본 60s 로는 긴 생성이 중간에 끊긴다.
        proxy_read_timeout   1h;
        client_max_body_size 40m;
    }

    # WebSocket(채팅 실시간) — 업그레이드 헤더 유지 + 압축/버퍼링 제외.
    location /api/v1/chat/ws {
        proxy_pass         http://oma_api;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        gzip            off;
        proxy_buffering off;

        proxy_read_timeout 1h;
    }
}
