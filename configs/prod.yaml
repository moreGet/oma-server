server:
  port: 8080
  # 본문 전체 수신까지 포함하는 상한. agent/chat 은 최대 32MiB(첨부 인라인)를 받으므로
  # 10s 면 느린 회선에서 본문이 잘려 위양성 400 이 난다. slowloris 는 ReadHeaderTimeout 이 따로 막는다.
  read_timeout: "120s"
  write_timeout: "10s"
security:
  allowed_origins: []          # 운영 도메인을 명시적으로 채울 것
  encryption_secret: "local-dev-only-encryption-key-change-me" # ⚠️ 기본 placeholder. 운영은 반드시 env(APP_ENCRYPTION_SECRET)로 고유 값 주입할 것(공유 시 키 복호화 위험)
database:
  driver: "mysql"
  dsn: ""                      # env(APP_DATABASE_DSN) 주입. 예: user:pw@tcp(host:3306)/aiagent?parseTime=true
  max_open_conns: 20
auth:
  jwt_secret: ""               # 운영 필수, env(APP_AUTH_JWT_SECRET) 주입(미설정 시 기동 실패)
  jwt_expiry: "24h"
  seed_admin_username: ""      # 운영은 시딩 금지
  seed_admin_password: ""
# 에이전트 레지스트리(등록·발견·생존성·A2A 토큰 브로커).
registry:
  heartbeat_interval: "15s"
  lease_ttl: "45s"          # 권장 3×heartbeat_interval
  token_ttl: "120s"         # A2A 브로커 토큰 수명
  sweep_interval: "5m"      # offline 로 오래(24h+) 방치된 레코드 정리 주기. "0s" = 비활성
