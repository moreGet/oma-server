server:
  port: 8080
  # 본문 전체 수신까지 포함하는 상한. agent/chat 은 최대 32MiB(첨부 인라인)를 받으므로
  # 10s 면 느린 회선에서 본문이 잘려 위양성 400 이 난다. slowloris 는 ReadHeaderTimeout 이 따로 막는다.
  read_timeout: "120s"
  write_timeout: "10s"
security:
  allowed_origins: []
  encryption_secret: "local-dev-only-encryption-key-change-me" # API 키 DB 직접 저장용 기본값. 운영은 env(APP_ENCRYPTION_SECRET)로 override
database:
  driver: "mysql"
  dsn: ""                      # env(APP_DATABASE_DSN) 주입. 예: user:pw@tcp(db:3306)/aiagent?parseTime=true
  max_open_conns: 10
auth:
  jwt_secret: ""               # env(APP_AUTH_JWT_SECRET) 주입
  jwt_expiry: "24h"
  seed_admin_username: "admin"
  seed_admin_password: ""      # env(APP_AUTH_SEED_ADMIN_PASSWORD) 주입
