server:
  port: 8080
  # 본문 전체 수신까지 포함하는 상한. agent/chat 은 최대 32MiB(첨부 인라인)를 받으므로
  # 10s 면 느린 회선에서 본문이 잘려 위양성 400 이 난다. slowloris 는 ReadHeaderTimeout 이 따로 막는다.
  read_timeout: "120s"
  write_timeout: "10s"
security:
  allowed_origins: [ ] # 비면 CORS 비활성(로컬)
  encryption_secret: "local-dev-only-encryption-key-change-me" # 로컬 편의값(API 키 DB 직접 저장용). 운영은 env(APP_ENCRYPTION_SECRET) 주입
database:
  driver: "sqlite"
  dsn: "file:~/aiagent.db?_pragma=busy_timeout(5000)"  # 홈 경로(리눅스 fs). /mnt/c 의 sqlite I/O 이슈 회피. ~ 는 config 로더가 홈으로 확장
  max_open_conns: 1 # sqlite 단일 writer
auth:
  jwt_secret: "local-dev-only-jwt-secret-change-me" # 로컬 편의 고정값(토큰 서명 안정 → 재시작해도 로그인 유지). 운영은 env(APP_AUTH_JWT_SECRET) 주입 필수
  jwt_expiry: "24h"
  seed_admin_username: "admin" # 비운영 시딩용
  seed_admin_password: "admin" # 비운영만, env(APP_AUTH_SEED_ADMIN_PASSWORD) 주입
# 참고: 도구 정책(tools/policy)·위험명령 차단(security/command-policy)·클라 버전(client/version)은
#       DB 에서 관리하며 어드민(/admin/tools, /admin/client)에서 편집한다(yaml 설정 아님).
# 채팅 실시간 전파 방식. memory=단일 인스턴스(기본), redis=다중 인스턴스 pub/sub.
messaging:
  broadcaster: "memory"   # memory | redis
  redis:
    addr: "localhost:6379"   # broadcaster=redis 일 때 접속 주소
    password: ""             # 운영은 env(APP_MESSAGING_REDIS_PASSWORD) override
    db: 0
    channel: "ohmyagent:chat"
